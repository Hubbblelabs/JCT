name: CI

on:
  push:
    branches: [main, v2-admin]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # The build needs no real services: build-time DB reads degrade to
      # on-demand ISR, and the NEXTAUTH_SECRET check only warns during the
      # build phase. These placeholders just satisfy any module-load env
      # reads — they are never used to serve traffic.
      #
      # MONGODB_URI is deliberately NOT set: connectDB() then throws its
      # clear "MONGODB_URI environment variable is not set" error instantly,
      # which every build-time caller catches and degrades from. A localhost
      # placeholder URI would instead burn the 15s server-selection timeout
      # on every cold connection attempt.
      NEXTAUTH_SECRET: ci-placeholder-secret-not-used-in-production-000
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Gate on lint without --fix (the package script auto-fixes, which would
      # hide violations in CI), then types and a full production build.
      - run: pnpm exec eslint .
      - run: pnpm typecheck
      - run: pnpm build

      # Advisory only — surfaces vulnerable deps without blocking the build.
      - run: pnpm audit --prod || true
