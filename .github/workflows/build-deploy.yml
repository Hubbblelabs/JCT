name: Build and Deploy

# Two triggers:
#   - pull_request      → lint, typecheck, format check
#   - push of a v* tag  → verify, then SSH to server to build and deploy
#
# Builds happen on the deployment server, not on GitHub runners, because the
# build needs to reach MongoDB on 127.0.0.1. docker-compose.prod.yaml's jct
# service has `build: network: host`, which lets next build see the loopback
# database and prerender ISR pages with real content. No registry involved —
# the image is built and run on the same host.
on:
  push:
    branches:
      - v3-admin
    tags:
      - "v*"
  pull_request:

jobs:
  verify:
    name: Lint, Typecheck and Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `next build` type-checks, but Next 16 no longer runs ESLint as part of
      # it — so without these steps nothing lints or format-checks this repo at
      # any point before it reaches production.
      - name: Lint
        run: pnpm lint:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm exec prettier --check .

  deploy:
    name: Deploy to Server
    needs: verify
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      # The host is a repo secret rather than a committed literal, and the
      # login prefers a key over a password. Set DEPLOY_HOST (required),
      # DEPLOY_USER (a non-root account in the `docker` group) and SSH_KEY;
      # appleboy/ssh-action uses the key when present and falls back to
      # SSH_PASSWORD only while the key secret is empty, so this can be
      # tightened without a broken deploy in between. Once SSH_KEY works,
      # delete SSH_PASSWORD and disable PermitRootLogin /
      # PasswordAuthentication on the server.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}

          script: |
            cd jctSite
            git fetch --all --tags
            git reset --hard origin/v3-admin
            docker compose -f docker-compose.prod.yaml build jct
            docker compose -f docker-compose.prod.yaml up -d --remove-orphans
