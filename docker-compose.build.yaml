# Build machine
#
# Build and push:
#   docker compose -f docker-compose.build.yaml build
#   docker compose -f docker-compose.build.yaml push
#
# or
#
#   docker compose -f docker-compose.build.yaml build --push
#
# Requires:
#   docker login
#
# MONGODB_URI is taken from .env using a BuildKit secret and is
# available only during build. NEXT_PUBLIC_R2_PUBLIC_URL is also taken from
# .env, as a plain build arg (it's a public value, baked into the client
# bundle either way).

services:
  jct:
    image: kavinnandha/jct:latest

    build:
      context: .
      dockerfile: dockerfile
      args:
        NEXT_PUBLIC_R2_PUBLIC_URL: ${NEXT_PUBLIC_R2_PUBLIC_URL}
      secrets:
        - mongodb_uri

secrets:
  mongodb_uri:
    environment: MONGODB_URI
