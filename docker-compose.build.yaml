# Build machine
#
# Build and push:
#   docker compose -f docker-compose.build.yaml build
#   docker compose -f docker-compose.build.yaml push
#
# or
#
#   docker compose -f docker-compose.build.yaml build --push
#
# Requires:
#   docker login
#
# MONGODB_URI is taken from .env using a BuildKit secret and is
# available only during build. The asset-origin vars are also taken from .env,
# as plain build args (they're public values, baked into the client bundle
# either way). Pass whichever your deployment sets — the unset one resolves to
# an empty arg and is ignored.
#
# `network: host` puts the build container on the host's network stack so
# `next build` can reach a MongoDB published on 127.0.0.1 (see
# docker-compose.prod.yaml). Without it the build container's loopback is its
# own, the DB is unreachable, and every DB-backed public page bakes empty —
# a failure that only shows up as a stale-looking site after deploy. Harmless
# when MONGODB_URI points somewhere remote instead.

services:
  jct:
    image: kavinnandha/jct:latest

    build:
      context: .
      dockerfile: dockerfile
      network: host
      args:
        NEXT_PUBLIC_STORAGE_PUBLIC_URL: ${NEXT_PUBLIC_STORAGE_PUBLIC_URL}
        NEXT_PUBLIC_R2_PUBLIC_URL: ${NEXT_PUBLIC_R2_PUBLIC_URL}
      secrets:
        - mongodb_uri

secrets:
  mongodb_uri:
    environment: MONGODB_URI
