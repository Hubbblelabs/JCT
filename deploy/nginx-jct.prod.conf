# Production nginx configuration for JCT
# Copy to /etc/nginx/sites-available/jct
# Enable: ln -s /etc/nginx/sites-available/jct /etc/nginx/sites-enabled/jct
# Test: nginx -t
# Reload: systemctl reload nginx

# Upstream: the app running in docker
upstream jct_app {
    server 127.0.0.1:3000;
}

# Upstream: Garage S3 API
upstream garage_s3 {
    server 127.0.0.1:3900;
}

# ─────────────────────────────────────────────────────────────────────────────
# Main application
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name jct.ac.in www.jct.ac.in;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name jct.ac.in www.jct.ac.in;

    # Certificates: issue with certbot
    # certbot certonly --nginx -d jct.ac.in -d www.jct.ac.in
    ssl_certificate /etc/letsencrypt/live/jct.ac.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jct.ac.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Backup route accepts large ZIPs (~7.5 GB)
    client_max_body_size 0;

    # Timeouts for large uploads/downloads
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    location / {
        proxy_pass http://jct_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "upgrade";
    }

    # Optional: nginx serves backup archives with sendfile() instead of piping through Node
    # Set BACKUP_ACCEL_PREFIX=/internal-backups in .env to enable
    location /internal-backups/ {
        internal;
        alias /srv/jct/backups/;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# CDN: Garage S3 API (with CORS)
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name cdn.jct.ac.in;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cdn.jct.ac.in;

    # Separate cert for the CDN domain, or use a wildcard/multi-SAN cert
    # certbot certonly --nginx -d cdn.jct.ac.in
    ssl_certificate /etc/letsencrypt/live/cdn.jct.ac.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.jct.ac.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # No compression: archive is already compressed
    gzip off;

    # Large file uploads (presigned PUTs from browser)
    client_max_body_size 0;
    proxy_request_buffering off;

    # CORS headers for all requests
    add_header 'Access-Control-Allow-Origin' 'https://jct.ac.in' always;
    add_header 'Access-Control-Allow-Methods' 'GET, PUT, HEAD, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' '*' always;
    add_header 'Access-Control-Expose-Headers' 'ETag' always;
    add_header 'Access-Control-Max-Age' '3000' always;

    location / {
        # Handle CORS preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        proxy_pass http://garage_s3;
        proxy_http_version 1.1;

        # Garage signs against the Host header. Rewriting it breaks SigV4 signatures.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable proxy buffering for large files
        proxy_buffering off;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# Redirect www.cdn to cdn (optional)
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 443 ssl;
    http2 on;
    server_name www.cdn.jct.ac.in;

    ssl_certificate /etc/letsencrypt/live/cdn.jct.ac.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.jct.ac.in/privkey.pem;

    return 301 https://cdn.jct.ac.in$request_uri;
}
