# Production host.
# Three services: the app, MongoDB, and Garage (S3-compatible object storage).
#
# Sized for the current on-prem box: 8 vCPU, 14 GiB RAM. The limits below are
# deliberate, not decoration — MongoDB sizes its WiredTiger cache from the
# memory it *sees*, and inside a container without a limit that is the whole
# host. Left unbounded it reserves ~6.5 GiB and then competes with `next build`,
# which is the memory-hungriest thing that runs here.

services:
  jct:
    container_name: jct

    restart: unless-stopped

    # `next build` reaches MongoDB to prerender the public ISR pages with real
    # content. Mongo is published on loopback only, so the build container
    # needs the host's network stack (`network: host`) to see 127.0.0.1 — its
    # own loopback wouldn't reach it otherwise, and every DB-backed page would
    # bake empty and stay wrong until the next revalidation.
    #
    # MONGODB_URI is passed as a BuildKit secret so it never lands in an image
    # layer. NEXT_PUBLIC_STORAGE_PUBLIC_URL is a plain build arg — it's a
    # public value, inlined into the client bundle either way, and NEXT_PUBLIC_*
    # vars must be present at build time; setting them only at runtime has no
    # effect.
    build:
      context: .
      dockerfile: dockerfile
      network: host
      args:
        NEXT_PUBLIC_STORAGE_PUBLIC_URL: ${NEXT_PUBLIC_STORAGE_PUBLIC_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      secrets:
        - mongodb_uri

    # `service_started` would let the app race Mongo's first-run user seeding on
    # a fresh volume: the app connects, fails auth, and Mongoose caches the dead
    # connection on the module global until the container is restarted by hand.
    depends_on:
      mongo:
        condition: service_healthy
      garage:
        condition: service_started

    # Bound to loopback so only the host's nginx can reach the app. Published
    # on 0.0.0.0 it was reachable directly at <host>:3000, bypassing the
    # reverse proxy's TLS, rate limiting and body-size settings that the
    # backup/restore routes depend on (see deploy/nginx-jct.conf.example).
    ports:
      - "127.0.0.1:3000:3000"

    env_file:
      - .env

    environment:
      # Where backup archives are built before they are downloaded. Bind-mounted
      # rather than left in the container: an archive is currently several GB,
      # which would otherwise land on the Docker overlay filesystem and be
      # thrown away on every rebuild. The host path also lets nginx serve the
      # file directly — see BACKUP_ACCEL_PREFIX in deploy/nginx-jct.conf.example.
      BACKUP_DIR: /var/backups/jct

    volumes:
      - /srv/jct/backups:/var/backups/jct

    # node:26-slim carries no curl or wget. Node's global fetch is the only HTTP
    # client in the image, so the check uses it rather than shipping a package
    # for the sake of one probe.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/public/programs').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

    mem_limit: 4g
    cpus: 6.0

    networks:
      - jct

  mongo:
    image: mongo:8
    container_name: jct-mongodb

    restart: unless-stopped

    # wiredTigerCacheSizeGB is set explicitly because the default is derived
    # from host RAM, not the cgroup limit — a 2 GiB cache under a 4 GiB limit
    # leaves room for connections, index builds and the restore path's bulk
    # writes without the OOM killer taking the database down mid-write.
    command: ["--auth", "--bind_ip_all", "--wiredTigerCacheSizeGB", "2"]

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}

    # Loopback only — see the `network: host` note on the jct build above.
    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - /srv/jct/mongo:/data/db

    # `ping` is on mongod's short list of commands allowed before auth, so this
    # needs no credentials and does not put the root password in `docker inspect`.
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

    # SIGTERM makes mongod flush and close cleanly. The default 10s is not
    # always enough for a checkpoint, and a killed mongod means recovery on the
    # next boot.
    stop_grace_period: 60s

    mem_limit: 4g
    cpus: 4.0

    ulimits:
      nofile:
        soft: 64000
        hard: 64000

    networks:
      - jct

  garage:
    # Pin a concrete version. `:latest` on a storage engine means an unattended
    # `docker compose pull` can change the on-disk metadata format under you.
    image: dxflrs/garage:v2.0.0
    container_name: jct-garage

    restart: unless-stopped

    ports:
      # 3900 is the S3 API — signed requests only. Both the server-side SDK and
      # the browser's presigned PUT talk to this, fronted by nginx as
      # https://cdn.jct.ac.in/<bucket>/<key>.
      - "127.0.0.1:3900:3900"
      # 3902 is the web endpoint, and it is not optional. Garage's S3 API
      # answers *every* unsigned request with
      # "Forbidden: Garage does not support anonymous access yet", so public
      # asset reads cannot go through 3900 at all. nginx maps
      # https://cdn.jct.ac.in/<key> here with the bucket name in the Host
      # header — see deploy/nginx-jct.conf.example.
      - "127.0.0.1:3902:3902"

    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      # Metadata and data are separate on purpose: metadata is small and
      # latency-sensitive (put it on SSD), data is bulk. Losing meta loses the
      # bucket even if data survives, so both belong in the backup plan.
      - /srv/jct/garage/meta:/var/lib/garage/meta
      - /srv/jct/garage/data:/var/lib/garage/data

    # The image is FROM scratch — no shell, no curl. `/garage` is the only
    # executable present, so the probe has to be the CLI itself in exec form.
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

    mem_limit: 2g
    cpus: 3.0

    networks:
      - jct

secrets:
  # MONGODB_BUILD_URI, not MONGODB_URI: the build runs with `network: host`, and
  # in the host namespace the compose alias `mongo` in MONGODB_URI resolves to
  # nothing. `next build` then prerenders every DB-backed page empty and the
  # site stays wrong until each one revalidates. See .env.example.
  mongodb_uri:
    environment: MONGODB_BUILD_URI

networks:
  jct:
    driver: bridge
